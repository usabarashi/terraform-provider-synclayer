# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: |
  Be concise and direct. This is an unofficial Go Terraform provider
  (terraform-plugin-sdk/v2) for SyncLayer home gateways. The provider is scoped
  to the manufacturer; resources and data sources are namespaced by product
  (synclayer_sxep200w_*). The device REST API was reverse-engineered from
  firmware, so prioritize correctness, state/plan consistency, and idempotency
  over stylistic nits.

early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  auto_apply_labels: false
  auto_assign_reviewers: false
  poem: false
  review_status: false
  sequence_diagrams: false

  path_filters:
    - "**/*.go"
    - "**/*.tf"
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "Makefile"
    - "flake.nix"
    - "go.mod"
    - "!flake.lock"
    - "!go.sum"
    - "!**/result/**"

  path_instructions:
    - path: "**/*.go"
      instructions: |
        Review Go code for terraform-plugin-sdk/v2 correctness:
        - schema validation, CustomizeDiff, and Optional+Computed semantics
        - drift detection, import support, and plan/apply idempotency
        - HTTP client behaviour: access-token refresh, re-authentication on 401,
          concurrency, and error propagation
        - resource/data-source names must stay namespaced by product
          (synclayer_sxep200w_*)
        Prefer actionable findings over formatting nits (gofmt is enforced in CI).

    - path: "internal/synclayer/crypto.go"
      instructions: |
        This file reproduces the device's password obfuscation. Verify the
        PBKDF2 (HMAC-SHA512, 2048 iterations, 32 byte output) and AES-128-CBC
        (zero padding, IV "0123456789012345", key = first 16 chars of the access
        token) implementations against the documented tests. Flag any real
        credential or device identifier; test vectors must be synthetic.

    - path: "internal/synclayer/client.go"
      instructions: |
        Focus on the HTTP client: the login challenge/response, the Access-Token
        header, transparent re-authentication, and response error handling.
        The management API is plain HTTP by design; do NOT report the absence of
        TLS as a vulnerability. DO report hardcoded/logged credentials, tokens,
        or device-identifying values. Note that the firmware may reassign ids on
        update (static routes), which the client resolves by identity.

    - path: "docs/**/*.md"
      instructions: |
        Terraform Registry style documentation. Check that examples compile, that
        argument/attribute lists match the Go schema, and that resource names
        remain namespaced by product (synclayer_sxep200w_*).

    - path: "examples/**/*.tf"
      instructions: |
        Terraform example configuration. Check provider/resource naming, required
        arguments, and that no real credentials, private addresses, or device
        identifiers are committed.

    - path: ".github/workflows/**/*.yml"
      instructions: |
        GitHub Actions workflow. Check least-privilege permissions, pinned action
        versions, and that the Go version matches go.mod.

    - path: "flake.nix"
      instructions: |
        Nix flake providing the dev shell and package. Check input pinning, that
        the devShell exposes go/terraform/gopls, and that vendorHash is consistent
        with go.mod/go.sum.

  auto_review:
    drafts: false
    ignore_title_keywords:
      - "wip"
      - "draft"
      - "do not merge"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    checkmake:
      enabled: true
    tflint:
      enabled: true
    # Disable tools for languages that are not used in this repository
    clippy:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    ruff:
      enabled: false
    phpstan:
      enabled: false
    oxc:
      enabled: false
    buf:
      enabled: false
    semgrep:
      enabled: false
    checkov:
      enabled: false

chat:
  art: false
  auto_reply: false

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
